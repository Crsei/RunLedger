name: syntax-highlighter-prebuild

on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  prebuild:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64-gnu, runner: ubuntu-24.04, rust: x86_64-unknown-linux-gnu }
          - { target: linux-arm64-gnu, runner: ubuntu-24.04-arm, rust: aarch64-unknown-linux-gnu }
          - { target: linux-x64-musl, runner: ubuntu-24.04, rust: x86_64-unknown-linux-musl }
          - { target: linux-arm64-musl, runner: ubuntu-24.04-arm, rust: aarch64-unknown-linux-musl }
          - { target: darwin-x64, runner: macos-15-intel, rust: x86_64-apple-darwin }
          - { target: darwin-arm64, runner: macos-15, rust: aarch64-apple-darwin }
          - { target: win32-x64-msvc, runner: windows-2025, rust: x86_64-pc-windows-msvc }
          - { target: win32-arm64-msvc, runner: windows-11-arm, rust: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.runner }}
    env:
      RUNLEDGER_SYNTAX_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22.23.1", cache: npm }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.3.14" }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.rust }}" }
      - name: Install musl build prerequisites
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - run: npm ci --ignore-scripts
      - run: npm run build:syntax-highlighter
      - run: npx tsc -p tsconfig.json
      - run: npx tsx scripts/package-syntax-highlighter-prebuild.ts ${{ matrix.target }}
      - name: node-smoke
        if: ${{ !contains(matrix.target, 'musl') }}
        run: node --import tsx scripts/smoke-syntax-highlighter-prebuild.ts
      - name: bun-smoke
        if: ${{ !contains(matrix.target, 'musl') }}
        run: bun scripts/smoke-syntax-highlighter-prebuild.ts
      - name: clean-consumer
        if: ${{ !contains(matrix.target, 'musl') }}
        run: node --experimental-strip-types scripts/verify-syntax-highlighter-clean-consumer.ts
      - name: clean-consumer-musl
        if: contains(matrix.target, 'musl')
        run: docker run --rm -e RUNLEDGER_SYNTAX_TARGET -v "${{ github.workspace }}:/workspace" -w /workspace node:22-alpine sh -lc "npm install --global bun@1.3.14 && node --experimental-strip-types scripts/verify-syntax-highlighter-clean-consumer.ts"
      - name: checksums.json
        run: node -e "const m=require('./npm/syntax-highlighter-${{ matrix.target }}/checksums.json');if(!/^[a-f0-9]{64}$/.test(m.files['runledger-syntax-highlighter.node']))process.exit(1)"
      - uses: actions/attest-build-provenance@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          subject-path: npm/syntax-highlighter-${{ matrix.target }}/runledger-syntax-highlighter.node
      - name: cosign sign-blob
        if: startsWith(github.ref, 'refs/tags/')
        uses: sigstore/cosign-installer@v3
      - if: startsWith(github.ref, 'refs/tags/')
        run: cosign sign-blob --yes --bundle npm/syntax-highlighter-${{ matrix.target }}/runledger-syntax-highlighter.node.sigstore.json npm/syntax-highlighter-${{ matrix.target }}/runledger-syntax-highlighter.node
      - name: cosign verify-blob
        if: startsWith(github.ref, 'refs/tags/')
        run: cosign verify-blob --bundle npm/syntax-highlighter-${{ matrix.target }}/runledger-syntax-highlighter.node.sigstore.json --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/syntax-highlighter-prebuild.yml@refs/tags/" --certificate-oidc-issuer https://token.actions.githubusercontent.com npm/syntax-highlighter-${{ matrix.target }}/runledger-syntax-highlighter.node
      - uses: actions/upload-artifact@v4
        with:
          name: syntax-${{ matrix.target }}
          path: |
            npm/syntax-highlighter-${{ matrix.target }}/runledger-syntax-highlighter.node
            npm/syntax-highlighter-${{ matrix.target }}/checksums.json
            npm/syntax-highlighter-${{ matrix.target }}/NOTICE.md
            npm/syntax-highlighter-${{ matrix.target }}/THIRD_PARTY_NOTICES.md
            npm/syntax-highlighter-${{ matrix.target }}/package.json
            npm/syntax-highlighter-${{ matrix.target }}/runledger-syntax-highlighter.node.sigstore.json
          if-no-files-found: error

  release-gate:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [prebuild]
    runs-on: ubuntu-24.04
    steps:
      - run: echo "all target runner evidence, checksums, signatures, and attestations passed"

  release-publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [release-gate]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: syntax-*
          path: release-packages
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          registry-url: https://registry.npmjs.org
      - name: Publish all target-specific optional packages with npm provenance
        run: |
          for package in release-packages/syntax-*; do
            npm publish "$package" --access public --provenance
          done
